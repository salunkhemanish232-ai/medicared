services:
  - type: web
    name: medicare-hospital-website
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: medicare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: medicare_db
