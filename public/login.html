<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Sign in to your Medicare patient account.">
	<title>Medicare - Patient Login</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-main">
	<div class="auth-container">
		<div class="auth-card">
			<div class="auth-header">
				<i class="fa-solid fa-hospital auth-icon"></i>
				<span class="tag tag--primary">Medicare Patient Portal</span>
				<h1>Welcome back</h1>
				<p class="subtitle">Sign in to book appointments and manage your care.</p>
			</div>
			<div class="auth-step-note"><i class="fa-solid fa-lock"></i><span>Your account keeps appointments and care updates in one place.</span></div>
			<div id="loginSuccess" class="success-banner" aria-live="polite"></div>
			<form class="auth-form" id="loginForm" novalidate>
				<div class="form-group">
					<label for="loginEmail"><i class="fa-solid fa-envelope"></i> Email Address</label>
					<input type="email" id="loginEmail" required autocomplete="email" placeholder="you@example.com">
				</div>
				<div class="form-group">
					<label for="loginPassword"><i class="fa-solid fa-lock"></i> Password</label>
					<div class="password-field">
						<input type="password" id="loginPassword" required autocomplete="current-password" placeholder="Enter your password" aria-describedby="loginPasswordHint">
						<button type="button" class="password-toggle" data-toggle-password="#loginPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
					</div>
					<small id="loginPasswordHint" class="field-hint">Use the password you created for your Medicare account.</small>
				</div>
				<div id="loginError" class="form-error" role="alert"></div>
				<button type="submit" class="btn-auth"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
			</form>
			<div class="auth-footer">
				<p>New to Medicare? <a href="register.html">Create an account</a></p>
				<p><a href="admin-login.html">Admin login</a></p>
				<a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back Home</a>
			</div>
		</div>
	</div>
</main>
<script src="app.js"></script>
</body>
</html>
