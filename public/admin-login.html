<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Medicare hospital management dashboard.">
    <title>Medicare - Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-user-shield auth-icon"></i>
                <span class="tag tag--primary">Medicare Admin Portal</span>
                <h1>Staff sign in</h1>
                <p class="subtitle">Access hospital records, appointments, and patient summaries.</p>
            </div>
            <div id="adminLoginSuccess" class="success-banner" aria-live="polite"></div>
            <form class="auth-form" id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminEmail"><i class="fa-solid fa-envelope"></i> Admin Email</label>
                    <input type="email" id="adminEmail" required autocomplete="email" placeholder="staff email address">
                </div>
                <div class="form-group">
                    <label for="adminPassword"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-field">
                        <input type="password" id="adminPassword" required autocomplete="current-password" placeholder="Enter admin password">
                        <button type="button" class="password-toggle" data-toggle-password="#adminPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div id="adminLoginError" class="form-error" role="alert"></div>
                <button type="submit" class="btn-auth"><i class="fa-solid fa-right-to-bracket"></i> Sign In as Admin</button>
            </form>
            <div class="auth-footer">
                <p class="auth-footer-note"><i class="fa-solid fa-shield-halved"></i> Authorized staff access only. Use credentials provisioned by your system administrator.</p>
                <a href="login.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Patient Login</a>
            </div>
        </div>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
