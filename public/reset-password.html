<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare - Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-lock auth-icon"></i>
                <span class="tag tag--primary">Security</span>
                <h1>Choose a new password.</h1>
                <p class="subtitle">Create a strong password to keep your account secure.</p>
            </div>
            <form class="auth-form" id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="resetPassword"><i class="fa-solid fa-lock"></i> New Password</label>
                    <div class="password-field">
                        <input type="password" id="resetPassword" name="password" required minlength="8" placeholder="Enter a strong password" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="#resetPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="resetConfirmPassword"><i class="fa-solid fa-lock"></i> Confirm Password</label>
                    <div class="password-field">
                        <input type="password" id="resetConfirmPassword" name="confirmPassword" required placeholder="Repeat your new password" autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="#resetConfirmPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>
                <div id="resetPasswordError" class="form-error" role="alert"></div>
                <div id="resetPasswordSuccess" class="success-banner" aria-live="polite"></div>
                <button type="submit" class="btn-auth"><i class="fa-solid fa-shield-heart"></i> Update password</button>
            </form>
            <div class="auth-footer">
                <p><a href="login.html">Return to login</a></p>
            </div>
        </div>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
