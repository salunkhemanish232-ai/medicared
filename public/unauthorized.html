<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Medicare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-ban auth-icon"></i>
                <span class="tag tag--primary">Access denied</span>
                <h1>You do not have permission to view this page.</h1>
                <p class="subtitle">Your current account role does not allow access to this area. Please sign in with the right account or contact the administrator.</p>
            </div>
            <div class="auth-footer">
                <a href="login.html" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Go to login</a>
                <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Back to home</a>
            </div>
        </div>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
