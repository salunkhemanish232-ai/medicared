<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recover your Medicare account password securely.">
    <title>Medicare - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
<main class="auth-main">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-key auth-icon"></i>
                <span class="tag tag--primary">Account recovery</span>
                <h1>Reset your password.</h1>
                <p class="subtitle">Enter the email associated with your Medicare account and we’ll generate a secure reset link.</p>
            </div>
            <form class="auth-form" id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="forgotEmail"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="forgotEmail" name="email" required placeholder="you@example.com" autocomplete="email">
                </div>
                <div id="forgotPasswordError" class="form-error" role="alert"></div>
                <div id="forgotPasswordSuccess" class="success-banner" aria-live="polite"></div>
                <button type="submit" class="btn-auth"><i class="fa-solid fa-paper-plane"></i> Send reset link</button>
            </form>
            <div class="auth-footer">
                <p><a href="login.html">Back to sign in</a></p>
                <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back Home</a>
            </div>
        </div>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
